services:
  ledger:
    environment:
      AIRWALLEX_CLIENT_ID: "${AIRWALLEX_CLIENT_ID:?AIRWALLEX_CLIENT_ID is required}"
      AIRWALLEX_API_KEY: "${AIRWALLEX_API_KEY:?AIRWALLEX_API_KEY is required}"
      AIRWALLEX_WEBHOOK_SECRET: "${AIRWALLEX_WEBHOOK_SECRET:?AIRWALLEX_WEBHOOK_SECRET is required}"
      AIRWALLEX_BASE_URL: "${AIRWALLEX_BASE_URL:-https://api.sandbox.airwallex.com}"
      REMOTE_AUTH_REPAYMENT_TERM: "${REMOTE_AUTH_REPAYMENT_TERM:?Set REMOTE_AUTH_REPAYMENT_TERM=asap}"
      KIT5_OPERATOR_TOKEN: "${KIT5_OPERATOR_TOKEN:?KIT5_OPERATOR_TOKEN is required}"
      KIT5_OPERATOR_ID: "${KIT5_OPERATOR_ID:?KIT5_OPERATOR_ID is required}"
      KIT5_ALLOWED_ORIGINS: "${KIT5_ALLOWED_ORIGINS:?KIT5_ALLOWED_ORIGINS is required}"
      KIT5_NOVA_GLOBAL_ACCOUNT_ID: "${KIT5_NOVA_GLOBAL_ACCOUNT_ID:?Verified Nova Global Account ID is required}"
      KIT5_NOVA_GLOBAL_ACCOUNT_CONNECTED_ACCOUNT_ID: "${KIT5_NOVA_GLOBAL_ACCOUNT_CONNECTED_ACCOUNT_ID:?Verified Nova connected account ID is required}"
      KIT5_NOVA_GLOBAL_ACCOUNT_CURRENCY: "${KIT5_NOVA_GLOBAL_ACCOUNT_CURRENCY:?Set KIT5_NOVA_GLOBAL_ACCOUNT_CURRENCY=USD}"
      AI_EVIDENCE_REVIEWER_ID: "${AI_EVIDENCE_REVIEWER_ID:?AI_EVIDENCE_REVIEWER_ID is required}"
      AI_EVIDENCE_REVIEW_ENABLED: "${AI_EVIDENCE_REVIEW_ENABLED:-true}"
      SALESFORCE_SNAPSHOT_MODE: demo
    ports:
      - "8000:3000"
