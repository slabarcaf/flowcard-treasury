name: AWS Go Demo Deployment

on:
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        default: false
        description: Deploy after validation/build (false produces sealed artifacts only)
      confirm_callback_cutover:
        type: boolean
        default: false
        description: Confirm legacy callbacks are disabled or explicitly migrated and Go URL secrets are reviewed
      enable_workers:
        type: boolean
        default: false
        description: Activate prepared background workers (financial execution remains disabled)

permissions:
  contents: read

concurrency:
  group: aws-demo-release
  cancel-in-progress: false

jobs:
  validate-and-test:
    if: github.ref == 'refs/heads/develop' && github.repository == 'slabarcaf/flowcard-treasury'
    uses: ./.github/workflows/go-ci.yml
    permissions:
      contents: read

  build-and-metadata:
    needs: validate-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.repository == 'slabarcaf/flowcard-treasury'
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
          cache: npm
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349
      - name: Define exact-source release identity
        id: meta
        run: echo "image_tag=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build:product
      - name: Build common Go runtime (all six modules, linux amd64)
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: >-
          docker buildx build --platform linux/amd64 --load
          --build-arg SOURCE_COMMIT=${GITHUB_SHA}
          --file infra/runtime/Dockerfile.go-stack --tag flowcard-go-stack:${IMAGE_TAG} .
      - name: Export exact container archive and sealed manifest
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          mkdir -p .image-archives .dev/go-release
          docker save "flowcard-go-stack:${IMAGE_TAG}" | gzip -n > .image-archives/go-stack.tar.gz
          IMAGE_ID="$(docker inspect --format '{{.Id}}' "flowcard-go-stack:${IMAGE_TAG}")"
          FRONTEND_SHA="$(bash infra/scripts/compute-frontend-hash.sh .dev/dist-product)"
          node infra/scripts/create-go-manifest.mjs --archive .image-archives/go-stack.tar.gz --image-id "$IMAGE_ID" --frontend-checksum "$FRONTEND_SHA" --output .dev/go-release/go-release-manifest.json
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: go-frontend-${{ steps.meta.outputs.image_tag }}
          path: .dev/dist-product/
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: go-containers-${{ steps.meta.outputs.image_tag }}
          path: .image-archives/
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: go-manifest-${{ steps.meta.outputs.image_tag }}
          path: .dev/go-release/
          include-hidden-files: true
          retention-days: 90
      - name: Build-only summary
        if: inputs.deploy != true
        run: echo 'Go runtime and original product artifacts are sealed. No AWS role was assumed and no deployment was requested.' >> "$GITHUB_STEP_SUMMARY"

  execute-release:
    needs: [validate-and-test, build-and-metadata]
    runs-on: ubuntu-latest
    if: inputs.deploy == true && github.ref == 'refs/heads/develop' && github.repository == 'slabarcaf/flowcard-treasury'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806
        with:
          name: go-frontend-${{ needs.build-and-metadata.outputs.image_tag }}
          path: .dev/dist-product/
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806
        with:
          name: go-containers-${{ needs.build-and-metadata.outputs.image_tag }}
          path: .image-archives/
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806
        with:
          name: go-manifest-${{ needs.build-and-metadata.outputs.image_tag }}
          path: .dev/go-release/
      - name: Verify foundation, approvals and sealed artifacts before OIDC
        env:
          GO_FOUNDATION_JSON: ${{ vars.GO_RELEASE_FOUNDATION_JSON }}
          CALLBACK_APPROVED: ${{ inputs.confirm_callback_cutover }}
          RELEASE_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          RELEASE_AWS_REGION: ${{ vars.AWS_REGION }}
        run: node infra/scripts/verify-go-release.mjs --deployment-inputs
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: flowcard-go-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Release the exact Go artifact
        env:
          ENABLE_WORKERS: ${{ inputs.enable_workers }}
        run: |
          set -euo pipefail
          ARGS=(--oidc --confirm-approval --confirm-callback-cutover --foundation .dev/go-release/go-foundation.json --manifest .dev/go-release/go-release-manifest.json --archives .image-archives --output .dev/go-release/recovery)
          if [[ "$ENABLE_WORKERS" == true ]]; then ARGS+=(--workers); fi
          node infra/scripts/deploy-go-stack.mjs "${ARGS[@]}"
      - name: Retain release and recovery metadata
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: go-release-evidence-${{ needs.build-and-metadata.outputs.image_tag }}
          path: .dev/go-release/
          include-hidden-files: true
          retention-days: 90
